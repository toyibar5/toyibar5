
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator SPLDV</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
    padding: 25px;
}

.container {
    max-width: 750px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    color: #2563eb;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    margin-bottom: 25px;
    color: #64748b;
}

h3 {
    margin: 20px 0 12px;
}

.equation {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
}

.equation input {
    width: 30%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 16px;
    text-align: center;
}

.equation span {
    align-self: center;
    font-weight: bold;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 12px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.reset {
    background: #64748b;
}

.result {
    margin-top: 25px;
    padding: 20px;
    background: #eff6ff;
    border-radius: 10px;
    display: none;
}

.result h3 {
    color: #1d4ed8;
    margin-top: 0;
}

.steps {
    line-height: 1.8;
    margin-top: 15px;
}

.answer {
    font-size: 20px;
    font-weight: bold;
    color: #15803d;
    margin-top: 15px;
}

@media(max-width: 500px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 18px;
    }

    .equation {
        gap: 5px;
    }

    .equation input {
        min-width: 0;
        padding: 9px 3px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Kalkulator SPLDV</h1>
    <p class="subtitle">
        Sistem Persamaan Linier Dua Variabel
    </p>

    <h3>Persamaan Pertama</h3>
    <div class="equation">
        <input type="number" id="a1" value="2">
        <span>x +</span>
        <input type="number" id="b1" value="3">
        <span>y =</span>
        <input type="number" id="c1" value="12">
    </div>

    <h3>Persamaan Kedua</h3>
    <div class="equation">
        <input type="number" id="a2" value="1">
        <span>x +</span>
        <input type="number" id="b2" value="-1">
        <span>y =</span>
        <input type="number" id="c2" value="1">
    </div>

    <button onclick="hitung()">Hitung SPLDV</button>
    <button class="reset" onclick="resetForm()">Reset</button>

    <div class="result" id="result">
        <h3>Hasil Penyelesaian</h3>
        <div id="steps" class="steps"></div>
        <div id="answer" class="answer"></div>
    </div>

</div>

<script>

function hitung() {

    let a1 = Number(document.getElementById("a1").value);
    let b1 = Number(document.getElementById("b1").value);
    let c1 = Number(document.getElementById("c1").value);

    let a2 = Number(document.getElementById("a2").value);
    let b2 = Number(document.getElementById("b2").value);
    let c2 = Number(document.getElementById("c2").value);

    let hasil = document.getElementById("result");
    let steps = document.getElementById("steps");
    let answer = document.getElementById("answer");

    if ([a1,b1,c1,a2,b2,c2].some(n => !Number.isFinite(n))) {
        alert("Masukkan semua angka dengan benar!");
        return;
    }

    let D = a1*b2 - a2*b1;
    let Dx = c1*b2 - c2*b1;
    let Dy = a1*c2 - a2*c1;

    hasil.style.display = "block";

    if (D === 0) {

        if (Dx === 0 && Dy === 0) {
            steps.innerHTML =
                "Determinan D = 0.<br>" +
                "Persamaan memiliki tak terhingga banyak penyelesaian.";
            answer.innerHTML = "SPLDV memiliki banyak solusi.";
        } else {
            steps.innerHTML =
                "Determinan D = 0.<br>" +
                "Sistem persamaan tidak konsisten.";
            answer.innerHTML = "Tidak memiliki solusi.";
        }

        return;
    }

    let x = Dx / D;
    let y = Dy / D;

    steps.innerHTML = `
        <b>1. Menentukan Determinan (D)</b><br>
        D = (${a1} × ${b2}) - (${a2} × ${b1})<br>
        D = ${D}<br><br>

        <b>2. Menentukan Determinan x (Dx)</b><br>
        Dx = (${c1} × ${b2}) - (${c2} × ${b1})<br>
        Dx = ${Dx}<br><br>

        <b>3. Menentukan Determinan y (Dy)</b><br>
        Dy = (${a1} × ${c2}) - (${a2} × ${c1})<br>
        Dy = ${Dy}<br><br>

        <b>4. Menghitung nilai x dan y</b><br>
        x = Dx / D = ${Dx} / ${D} = ${x.toFixed(4)}<br>
        y = Dy / D = ${Dy} / ${D} = ${y.toFixed(4)}
    `;

    answer.innerHTML =
        `Nilai x = ${x.toFixed(4)}<br>` +
        `Nilai y = ${y.toFixed(4)}`;

}

function resetForm() {

    document.getElementById("a1").value = "";
    document.getElementById("b1").value = "";
    document.getElementById("c1").value = "";

    document.getElementById("a2").value = "";
    document.getElementById("b2").value = "";
    document.getElementById("c2").value = "";

    document.getElementById("result").style.display = "none";

}

</script>

</body>
</html>
